services:
  traefik:
    container_name: lab-traefik
    image: traefik:v3.7.14
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=false"
      - "--entryPoints.web.address=:8000"
      - "--entryPoints.traefik.address=:8080"
      - "--ping=true"
    ports:
      - "8000:8000"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "traefik healthcheck --ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
